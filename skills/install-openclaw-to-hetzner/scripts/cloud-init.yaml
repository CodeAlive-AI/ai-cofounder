#cloud-config
# OpenClaw bootstrap for Hetzner Cloud VM (Ubuntu 24.04 LTS, ARM cax11 or x86 cx22)
#
# The wizard in SKILL.md substitutes four placeholders before passing this
# file to `hcloud server create --user-data-from-file ...`:
#   {{SSH_PUBLIC_KEY}}     -- single-line authorized_key for the openclaw user
#   {{TELEGRAM_BOT_TOKEN}} -- BotFather token
#   {{LLM_ENV_LINE}}       -- ONE of:
#                              ANTHROPIC_API_KEY=sk-ant-...
#                              OPENROUTER_API_KEY=sk-or-...
#                              (empty string -- for OpenAI Codex OAuth flow,
#                               which the wizard runs via SSH after bootstrap)
#   {{USER_LANGUAGE}}      -- ISO 639-1 code of the user's language: `ru`, `en`,
#                              `de`, ... The bot will answer in this language
#                              by default. Defaults to `ru` for the workshop
#                              audience; switch to `en` for international users.
#
# TELEGRAM_CHAT_ID is intentionally NOT a placeholder. The wizard auto-detects
# it after the user presses /start in Telegram, then appends it to gateway.env
# over SSH and restarts the adapter.
#
# Hetzner notes:
#   - cloud-init user-data max size: 32 KiB. This file fits.
#   - On ARM (cax*) servers the primary NIC is `enp7s0`, not eth0. We never
#     hardcode interface names -- cloud-init handles network config via the
#     Hetzner-injected stanza, which is merged with ours.
#   - Hetzner-level firewall (created by the wizard) is the first line of
#     defense; ufw inside the VM is defense-in-depth and also helps if the
#     user later detaches the cloud firewall.
#
# Everything runs once on first boot. Progress is appended to
# /var/log/openclaw-bootstrap.log and the marker /var/lib/openclaw-bootstrap-done
# is written only when every step succeeds. The wizard polls for that marker.

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates
  - gnupg
  - git
  - jq
  - ufw
  - fail2ban
  - unattended-upgrades

users:
  - name: openclaw
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [users, sudo]
    lock_passwd: true
    ssh_authorized_keys:
      - "{{SSH_PUBLIC_KEY}}"

write_files:
  # SSH hardening -- drop-in (preserved across openssh-server upgrades).
  # Based on CIS Ubuntu 24.04 Benchmark + Mozilla "Modern" OpenSSH guidelines.
  # Items already off by default in OpenSSH 9.7+ (Protocol 1, RhostsAuth,
  # KerberosAuth, GSSAPIAuth, HostbasedAuth, IgnoreRhosts) are not repeated.
  - path: /etc/ssh/sshd_config.d/99-openclaw-hardening.conf
    permissions: '0644'
    content: |
      # --- Authentication ---
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      # Raised from CIS's 4: a controlling automation agent may present several
      # SSH identities from its ssh-agent/keyring before offering the right key.
      # With MaxAuthTries 4 those probes exhaust into "Too many authentication
      # failures" -- which also registers as a fail2ban failure and bans the
      # agent. Key-only auth keeps a higher value safe. (Belt-and-suspenders:
      # the controlling agent should also use `-o IdentitiesOnly=yes -i <key>`.)
      MaxAuthTries 10
      LoginGraceTime 30
      AllowUsers openclaw
      # RSA keys below 3072 bit are no longer trusted in 2026.
      RequiredRSASize 3072

      # --- Session limits & timeouts ---
      ClientAliveInterval 60
      ClientAliveCountMax 3
      # Raised well above defaults so an automation agent making many
      # concurrent, already-authenticated SSH connections is never throttled
      # pre-auth. Security rests on key-only auth + fail2ban, not connection caps.
      MaxSessions 50
      MaxStartups 100:30:200

      # --- Forwarding / tunneling (defense in depth -- none of these are
      #     needed by OpenClaw, and turning them off limits blast-radius if
      #     the SSH key ever leaks) ---
      AllowTcpForwarding no
      AllowAgentForwarding no
      AllowStreamLocalForwarding no
      GatewayPorts no
      PermitTunnel no
      X11Forwarding no
      PermitUserEnvironment no
      Compression no

      # --- DNS & logging ---
      UseDNS no
      LogLevel VERBOSE

      # --- Crypto (post-quantum first, then curve25519, then DH 16/18) ---
      # Explicit lists protect against future OpenSSH builds that re-enable
      # weak algos for compat. ssh-audit.com 2025 hardening profile.
      KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group18-sha512,diffie-hellman-group16-sha512
      Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr
      MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
      HostKeyAlgorithms ssh-ed25519-cert-v01@openssh.com,ssh-ed25519,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256-cert-v01@openssh.com,rsa-sha2-256

  # fail2ban -- escalating ban on SSH brute force.
  # Reads sshd events from systemd journal (Ubuntu 24.04 default).
  #
  # IMPORTANT: fail2ban bans ONLY on repeated FAILED authentications. A
  # key-authenticated user or automation agent never fails auth, so frequent
  # legitimate SSH (even hundreds of connects from a busy AI agent) is NEVER
  # rate-limited or banned by fail2ban. This is precisely why SSH can be left
  # open with no per-IP lock and no ufw rate-limit -- brute-forcers (who DO fail
  # auth) get banned, authenticated users never do.
  #
  # Tuned for a single non-DevOps user: forgiving on first mistakes
  # (5 retries before any ban, 1h initial bantime, 24h cap) but still
  # blocks sustained brute force. The aggressive [recidive] jail is
  # intentionally OFF -- for a 1-user VM it's too easy to lock yourself
  # out for a week with a misconfigured laptop.
  - path: /etc/fail2ban/jail.local
    permissions: '0644'
    content: |
      [DEFAULT]
      backend  = systemd
      bantime  = 1h
      findtime = 10m
      maxretry = 6
      banaction = ufw
      # Loopback/link-local always ignored. SSH is open to all (no per-IP lock,
      # no ufw rate-limit) by design -- fail2ban is the brute-force control and
      # it only ever bans IPs that repeatedly FAIL auth, never key-authenticated
      # users or the automation agent.
      ignoreself = true
      ignoreip   = 127.0.0.1/8 ::1
      # Recidivism: each repeat ban gets multiplied (2 x previous), capped at 24h.
      # Cap is deliberately 24h, not 1w -- recovery via Hetzner console (VNC)
      # is painful for a non-DevOps user; we'd rather re-allow a noisy IP
      # the next day than strand the founder over a long weekend.
      bantime.increment = true
      bantime.factor    = 2
      bantime.maxtime   = 24h
      bantime.rndtime   = 5m

      [sshd]
      enabled  = true
      maxretry = 5
      # Pin the filter to "normal" so ONLY genuine failed authentications count.
      # The aggressive/ddos modes also count pre-auth "Connection closed
      # [preauth]" churn -- which a high-frequency automation agent produces in
      # bulk -- and would ban it despite valid keys. Pinning protects against a
      # future distro/fail2ban default drifting away from "normal".
      mode     = normal

  # Auto security updates with quiet daily reboots at 03:30 UTC.
  # Allowed-Origins includes base codename because security patches often
  # pull dependencies from there; without it dpkg can stall.
  - path: /etc/apt/apt.conf.d/52openclaw-unattended.conf
    permissions: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
      Unattended-Upgrade::Automatic-Reboot-Time "03:30";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::SyslogEnable "true";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  # Sudo I/O + audit logging -- relevant because we use NOPASSWD: ALL.
  # If the SSH key ever leaks, log_input/log_output preserves a forensic
  # trail of what the attacker did before they could clean it up.
  - path: /etc/sudoers.d/99-openclaw-logging
    permissions: '0440'
    owner: root:root
    content: |
      Defaults log_input, log_output
      Defaults logfile="/var/log/sudo.log"
      Defaults iolog_dir="/var/log/sudo-io"

  # Locale packs -- appended to ~/.openclaw/workspace/USER.md after
  # ceo-ai-os/openclaw/install.sh runs, based on {{USER_LANGUAGE}}.
  # The bot reads USER.md on session start and adopts the preference.
  - path: /usr/local/share/openclaw-locale-ru.md
    permissions: '0644'
    encoding: b64
    # base64 so this cloud-init stays pure ASCII (non-ASCII here
    # historically corrupted into invalid YAML in transit). Edit the
    # readable source then regenerate:
    #   base64 -w0 scripts/locale/openclaw-locale-ru.md
    content: 

  - path: /usr/local/share/openclaw-locale-de.md
    permissions: '0644'
    encoding: b64
    # base64 so this cloud-init stays pure ASCII (non-ASCII here
    # historically corrupted into invalid YAML in transit). Edit the
    # readable source then regenerate:
    #   base64 -w0 scripts/locale/openclaw-locale-de.md
    content: 

  # Credentials env-file -- read by the gateway systemd unit. chmod 600 openclaw:openclaw.
  # The wizard appends TELEGRAM_CHAT_ID=... at the end after auto-detecting it
  # from getUpdates (Step 4 in SKILL.md). For openai-codex the LLM line is empty
  # and the OAuth profile lives in ~/.openclaw/agents/main/agent/auth-profiles.json.
  - path: /home/openclaw/.openclaw/gateway.env
    owner: openclaw:openclaw
    permissions: '0600'
    defer: true
    content: |
      TELEGRAM_BOT_TOKEN={{TELEGRAM_BOT_TOKEN}}
      {{LLM_ENV_LINE}}
      PATH=/home/openclaw/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
      HOME=/home/openclaw
      # Stop `openclaw doctor --fix` installing a competing user-level gateway
      # unit -- this skill runs the gateway as a system service (see above).
      OPENCLAW_SERVICE_REPAIR_POLICY=external

  # systemd SYSTEM service for the gateway (NOT a --user unit).
  # A user-mode unit needs `loginctl enable-linger` + a live XDG_RUNTIME_DIR /
  # user bus (fragile on a headless VM) AND it CANNOT apply the Protect*/
  # Restrict* sandboxing below: an unprivileged user manager rejects those with
  # status=218/EXIT_CAPABILITIES and the gateway never starts. A system unit
  # running as User=openclaw fixes both -- the gateway resolves its config
  # purely from $HOME (no login session) and the hardening applies cleanly.
  # Upstream OpenClaw documents this exact system-mode layout for always-on
  # servers (load-bearing directives RestartPreventExitStatus / KillMode /
  # SuccessExitStatus are kept verbatim from upstream's generated unit).
  - path: /etc/systemd/system/openclaw-gateway.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=OpenClaw Gateway
      After=network-online.target
      Wants=network-online.target
      # The gateway exits with sysexits 78 (EX_CONFIG) on a supervised-lock or
      # port conflict; RestartPreventExitStatus=78 below stops a crash-loop.
      StartLimitIntervalSec=60
      StartLimitBurst=5

      [Service]
      Type=simple
      User=openclaw
      Group=openclaw
      # HOME/PATH also come from the env file, but set them explicitly so the
      # gateway can never start with a bare environment.
      Environment=HOME=/home/openclaw
      Environment=PATH=/home/openclaw/.npm-global/bin:/usr/local/bin:/usr/bin:/bin
      WorkingDirectory=/home/openclaw
      EnvironmentFile=/home/openclaw/.openclaw/gateway.env
      ExecStart=/home/openclaw/.npm-global/bin/openclaw gateway run
      Restart=always
      RestartSec=5
      # 78 = clean config conflict (looping won't help); 143 = SIGTERM on stop.
      RestartPreventExitStatus=78
      SuccessExitStatus=0 143
      TimeoutStartSec=240
      TimeoutStopSec=60
      # Keep child workers (ACP runtime, browser/Chrome) in the service cgroup
      # so a restart never orphans them.
      KillMode=control-group

      # Memory limits -- gateway is Node.js, accumulates ~1.5G RSS over days.
      # MemoryMax + Restart=always = self-recovering. On a 2 GB VM the bootstrap
      # also adds a 2 GB swapfile (phase 0) so MemoryMax=2500M has spill room.
      MemoryAccounting=yes
      MemoryHigh=1500M
      MemoryMax=2500M

      # systemd sandboxing -- these now apply because this is a SYSTEM unit
      # (a user manager would reject them with 218/CAPABILITIES). They do not
      # restrict the user-space Node features OpenClaw needs.
      NoNewPrivileges=yes
      PrivateTmp=yes
      ProtectControlGroups=yes
      ProtectKernelModules=yes
      ProtectKernelTunables=yes
      ProtectKernelLogs=yes
      ProtectClock=yes
      RestrictRealtime=yes
      RestrictSUIDSGID=yes
      LockPersonality=yes
      # RestrictNamespaces is intentionally NOT set: OpenClaw may launch a
      # headless Chrome/browser worker that relies on namespaces; restricting
      # them risks breaking the browser. The directives above don't affect it.

      [Install]
      WantedBy=multi-user.target

  # Main bootstrap script -- runs as root from runcmd
  - path: /usr/local/sbin/openclaw-bootstrap.sh
    permissions: '0750'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      LOG=/var/log/openclaw-bootstrap.log
      exec > >(tee -a "$LOG") 2>&1
      phase() { printf '\n===== %s | %s =====\n' "$(date -u +%FT%TZ)" "$*"; }
      fail() { echo "ERROR: $*" >&2; exit 1; }

      phase "1/8 Firewall + SSH hardening + auto-updates"
      # ufw -- default-deny ingress, allow everything out (OpenClaw needs
      # to talk to many SaaS APIs). SSH is `allow` (NOT `limit`): an automation
      # AI agent makes frequent, already-authenticated SSH connections, and
      # ufw's `limit` (6 conn / 30s) would drop them as if they were a flood.
      # Key-only auth + fail2ban (which bans only on FAILED auths) are the
      # controls; there is no connection rate-limit. Defense-in-depth alongside
      # the cloud-side Hetzner firewall created by the install wizard.
      ufw --force reset
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp comment 'SSH (open, no rate-limit -- automation agent needs frequent connects; key-only auth is the control)'
      ufw logging low
      ufw --force enable

      # Validate the SSH drop-in before reloading sshd; a broken config
      # would lock us out forever on a fresh VM. `sshd -t` needs the privilege
      # separation dir /run/sshd, which systemd creates only when sshd starts;
      # this early in boot it does not exist yet, and without it `sshd -t` dies
      # with "Missing privilege separation directory" (a transient race that
      # would otherwise fail the whole `set -euo pipefail` bootstrap).
      install -d -m 0755 -o root -g root /run/sshd
      sshd -t -f /etc/ssh/sshd_config || fail "sshd_config drop-in is invalid"
      systemctl reload ssh

      systemctl enable --now fail2ban
      systemctl enable --now unattended-upgrades

      # snapd defensive purge. Hetzner's Ubuntu 24.04 cloud image historically
      # ships snapd (it's the upstream Canonical image). CVE-2026-3888 (LPE
      # in snapd) means any local user -> root if vulnerable snapd is present.
      # OpenClaw doesn't use snaps for anything, so removing is safe.
      if dpkg -s snapd >/dev/null 2>&1; then
        apt-get purge -y snapd
        # Block reinstall via apt-pinning so unattended-upgrades doesn't bring it
        # back. Written with printf (NOT a heredoc): a heredoc body must sit at
        # column 0, which dedents below this YAML block scalar's 6-space indent
        # and corrupts the whole cloud-init -- printf keeps every line indented.
        printf 'Package: snapd\nPin: release a=*\nPin-Priority: -1\n' > /etc/apt/preferences.d/no-snapd
      fi

      # Ensure sudo I/O log directory exists with strict perms.
      install -d -m 0750 -o root -g adm /var/log/sudo-io
      touch /var/log/sudo.log && chmod 0640 /var/log/sudo.log && chown root:adm /var/log/sudo.log

      phase "2/8 Node.js 22 LTS via NodeSource"
      # NodeSource ships both x86_64 and arm64 -- works on cax* and cx*.
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      apt-get install -y nodejs
      node --version
      npm --version

      phase "3/8 OpenClaw global install (as openclaw user)"
      sudo -iu openclaw bash -lc '
        set -euo pipefail
        mkdir -p ~/.npm-global
        npm config set prefix ~/.npm-global
        grep -qxF "export PATH=\$HOME/.npm-global/bin:\$PATH" ~/.bashrc \
          || echo "export PATH=\$HOME/.npm-global/bin:\$PATH" >> ~/.bashrc
        export PATH=$HOME/.npm-global/bin:$PATH
        npm install -g openclaw@latest
        openclaw --version
      '

      phase "4/8 ceo-ai-os workspace (48 skills + bootstrap) + locale"
      sudo -iu openclaw bash -lc '
        set -euo pipefail
        export PATH=$HOME/.npm-global/bin:$PATH
        cd ~
        if [ ! -d ceo-ai-os ]; then
          git clone --depth 1 https://github.com/CodeAlive-AI/ceo-ai-os.git
        fi
        bash ceo-ai-os/openclaw/install.sh

        # Locale override -- ceo-ai-os USER.md/SOUL.md are in English.
        # Append the locale pack BEFORE the gateway starts its first session,
        # so the first reply already respects the language. Locale packs live
        # at /usr/local/share/openclaw-locale-<lang>.md (written above).
        LOCALE_PACK="/usr/local/share/openclaw-locale-{{USER_LANGUAGE}}.md"
        if [ -f "$LOCALE_PACK" ]; then
          cat "$LOCALE_PACK" >> ~/.openclaw/workspace/USER.md
          echo "Locale applied: {{USER_LANGUAGE}}"
        else
          echo "Locale pack for {{USER_LANGUAGE}} not found -- keeping ceo-ai-os English default"
        fi
      '

      phase "5/8 OpenClaw config -- Telegram + LLM provider"
      sudo -iu openclaw bash -lc '
        set -euo pipefail
        export PATH=$HOME/.npm-global/bin:$PATH
        # Source credentials so openclaw onboard/config see them
        set -a; . ~/.openclaw/gateway.env; set +a

        # Non-interactive scaffold (idempotent). The real non-interactive flag is
        # `--non-interactive` (it requires `--accept-risk`, per OpenClaw onboarding
        # security checkpoint). The older `--no-prompt` is NOT a real flag on
        # current CLIs -- Commander swallows it and onboard becomes a silent no-op.
        # Try the correct flags first; fall back for older builds. The follow-up
        # `openclaw config set ...` calls below do the actual configuration either
        # way, so this is only a best-effort scaffold.
        openclaw onboard --non-interactive --accept-risk 2>/dev/null \
          || openclaw onboard --no-prompt 2>/dev/null || true

        # Telegram channel
        openclaw config set channels.telegram.enabled true
        openclaw config set channels.telegram.botToken "$TELEGRAM_BOT_TOKEN"
        openclaw config set channels.telegram.dmPolicy "pairing"

        # LLM provider -- auto-detected from whichever env var the wizard set.
        # The unset case (no env var) is OpenAI Codex OAuth, handled post-boot
        # by the wizard via `openclaw models auth login --provider openai-codex`.
        if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
          openclaw config set agents.defaults.model.primary   "anthropic/claude-sonnet-4-6"
          openclaw config set agents.defaults.model.fallbacks "[\"anthropic/claude-haiku-4-5\"]"
          echo "Configured: Anthropic (claude-sonnet-4-6 primary)"
        elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
          openclaw config set agents.defaults.model.primary   "openrouter/moonshotai/kimi-k2.6"
          openclaw config set agents.defaults.model.fallbacks "[\"openrouter/openai/gpt-5.5\",\"openrouter/anthropic/claude-haiku-4-5\"]"
          echo "Configured: OpenRouter (moonshotai/kimi-k2.6 primary)"
        else
          # OAuth flow case -- leave primary unset, wizard will set it after
          # `openclaw models auth login --provider openai-codex` completes
          echo "Configured: no LLM env key -- expecting OAuth login (openai-codex) from the wizard"
        fi

        # Gateway listens on loopback only -- safe to disable token auth on a 1-user VM
        openclaw config set gateway.auth.mode "none"

        # Lower bootstrap budget -- workshop bots don'\''t need 20 KB AGENTS.md
        openclaw config set agents.defaults.bootstrapMaxChars 15000
      '

      phase "6/8 Enable + start gateway as a SYSTEM service"
      # System unit (see write_files: /etc/systemd/system/openclaw-gateway.service).
      # No `loginctl enable-linger`, no XDG_RUNTIME_DIR, no user bus -- a system
      # service starts at boot and survives logout by design. This is also what
      # lets the Protect*/Restrict* sandboxing apply (a user manager rejects it
      # with status=218/CAPABILITIES).
      systemctl daemon-reload
      systemctl enable --now openclaw-gateway.service

      phase "7/8 Wait for /health 200 (up to 4 minutes)"
      for i in $(seq 1 48); do
        if curl -fsS -m 3 http://127.0.0.1:18789/health >/dev/null 2>&1; then
          echo "Gateway healthy after ~$((i*5))s"
          break
        fi
        sleep 5
      done
      curl -fsS -m 5 http://127.0.0.1:18789/health \
        || fail "gateway did not become healthy in time -- see journalctl -u openclaw-gateway"

      phase "8/8 Finalize -- secret scrub + ready marker"
      # No welcome message here: TELEGRAM_CHAT_ID isn't known yet (the wizard
      # auto-detects it via getUpdates after the user presses /start, in Step 4
      # of SKILL.md), and the bot's dmPolicy is `pairing` until the wizard
      # approves the chat.

      # Scrub user-data left on disk by cloud-init (contains secrets)
      shred -u /var/lib/cloud/instance/user-data.txt 2>/dev/null || \
        rm -f /var/lib/cloud/instance/user-data.txt
      shred -u /var/lib/cloud/instance/cloud-config.txt 2>/dev/null || \
        rm -f /var/lib/cloud/instance/cloud-config.txt

      touch /var/lib/openclaw-bootstrap-done
      phase "DONE -- OpenClaw is up."

runcmd:
  - [ /usr/local/sbin/openclaw-bootstrap.sh ]

final_message: "OpenClaw bootstrap finished after $UPTIME. See /var/log/openclaw-bootstrap.log and /var/lib/openclaw-bootstrap-done."
